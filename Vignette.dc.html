</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:500},&quot;scene&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;arch&quot;,&quot;balcony&quot;,&quot;window&quot;,&quot;door&quot;],&quot;default&quot;:&quot;arch&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.scene ?? 'arch';
    return { isArch: s === 'arch', isBalcony: s === 'balcony', isWindow: s === 'window', isDoor: s === 'door', showCaption: this.props.caption ?? true };
  }
}
</script>
